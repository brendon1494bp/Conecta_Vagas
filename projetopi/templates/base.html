<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Conecta de Vagas GDF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --gdf-blue: #003366; --gdf-yellow: #FFCC00; }
        body { background-color: #f4f6f9; }
        .navbar-gdf { background-color: var(--gdf-blue); }
        .navbar-brand, .nav-link { color: #fff !important; }
        .btn-gdf { background-color: var(--gdf-yellow); color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-gdf shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">🏛️ Conecta Vagas GDF</a>
            <div class="navbar-nav ms-auto">
                {% if session.get('user_id') %}
                    <a class="nav-link" href="/dashboard">Nova Solicitação</a>
                    <a class="nav-link" href="/tracking">Acompanhamento</a>
                    <a class="nav-link btn btn-danger text-white ms-2 px-3 py-1" href="/logout">Sair</a>
                {% else %}
                    <a class="nav-link" href="/login">Entrar</a>
                    <a class="nav-link btn btn-gdf ms-2 px-3 py-1 text-dark" href="/register">Cadastre-se</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container my-5">{% block content %}{% endblock %}</div>
</body>
</html>
