{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 bg-white p-4 rounded shadow-sm">
        <h3 class="mb-4" style="color: #003366;">📝 Dados do Aluno e Vaga Desejada</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nome do Aluno</label>
                <input type="text" name="student_name" class="form-control" required>
            </div>
            
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">CEP</label>
                    <input type="text" id="cep" name="cep" class="form-control" placeholder="00000-000" maxlength="9" required onblur="pesquisarCep(this.value)">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Estado (UF)</label>
                    <input type="text" id="state" name="state" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Região Administrativa (RA)</label>
                    <select id="administrative_region" name="administrative_region" class="form-control" required onchange="carregarEscolas(this.value)">
                        <option value="">Selecione a RA...</option>
                        {% for reg in regions %}
                            <option value="{{ reg.administrative_region }}">{{ reg.administrative_region }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Bairro</label>
                <input type="text" id="neighborhood" name="neighborhood" class="form-control" required>
            </div>

            <hr>
            <h5 class="mb-3" style="color: #003366;">🏫 Dados da Vaga</h5>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Escola Atual (Digite o nome)</label>
                    <input type="text" name="current_school" class="form-control" placeholder="Ex: Escola X" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Turno Atual</label>
                    <select name="current_shift" class="form-control" required>
                        <option value="Matutino">Matutino</option>
                        <option value="Vespertino">Vespertino</option>
                        <option value="Noturno">Noturno</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Escola Desejada (Selecione a RA acima primeiro)</label>
                    <select id="desired_school" name="desired_school" class="form-control" required>
                        <option value="">Selecione primeiro a Região Administrativa</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Turno Desejado</label>
                    <select name="desired_shift" class="form-control" required>
                        <option value="Matutino">Matutino</option>
                        <option value="Vespertino">Vespertino</option>
                        <option value="Integral">Integral</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark">Solicitar Troca de Vaga</button>
        </form>
    </div>
</div>

<script>
// Preenchimento automático de CEP
function pesquisarCep(valor) {
    var cep = valor.replace(/\D/g, '');
    if (cep != "") {
        var validacep = /^[0-9]{8}$/;
        if(validacep.test(cep)) {
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(response => response.json())
                .then(data => {
                    if (!("erro" in data)) {
                        document.getElementById('neighborhood').value = data.bairro;
                        document.getElementById('state').value = data.uf;
                    } else {
                        alert("CEP não encontrado.");
                    }
                });
        }
    }
}

// Carregar as escolas dinamicamente com base na Região Administrativa selecionada
function carregarEscolas(regiao) {
    var selectEscola = document.getElementById('desired_school');
    selectEscola.innerHTML = '<option value="">Carregando escolas...</option>';

    if (regiao === "") {
        selectEscola.innerHTML = '<option value="">Selecione primeiro a Região Administrativa</option>';
        return;
    }

    fetch(`/api/schools/${regiao}`)
        .then(response => response.json())
        .then(data => {
            selectEscola.innerHTML = '<option value="">Selecione a escola desejada...</option>';
            if (data.length === 0) {
                selectEscola.innerHTML = '<option value="">Nenhuma escola cadastrada nesta região</option>';
            } else {
                data.forEach(escola => {
                    var opt = document.createElement('option');
                    opt.value = escola.school_name;
                    opt.textContent = escola.school_name;
                    selectEscola.appendChild(opt);
                });
            }
        });
}
</script>
{% endblock %}
