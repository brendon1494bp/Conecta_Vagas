{% extends 'base.html' %}{% block title %}Meu perfil | Conecta Vagas{% endblock %}{% block content %}<div class="form-shell"><div class="eyebrow">Minha conta</div><h1>Meu perfil</h1><form method="post" class="surface" id="cpf-form"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Nome completo<input class="form-control" name="nome" maxlength="150" value="{{ user['nome'] }}" required></label><label>E-mail<input class="form-control" value="{{ user['email'] }}" disabled></label><label>CPF<input class="form-control" name="cpf" maxlength="14" minlength="14" inputmode="numeric" data-mask="cpf" value="{{ user['cpf'] }}" required></label><label>Telefone<input class="form-control" name="telefone" maxlength="15" value="{{ user['telefone'] or '' }}"></label><label>CEP <span class="text-muted">(opcional)</span><input class="form-control" name="cep" maxlength="9" inputmode="numeric" data-mask="cep" value="{{ user['cep'] or '' }}"></label><label>Endereço<input class="form-control" name="endereco" maxlength="255" value="{{ user['endereco'] or '' }}"></label><button class="btn btn-primary">Salvar alterações</button></form></div><script src="{{ url_for('static', filename='masks.js') }}"></script>{% endblock %}
