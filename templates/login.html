{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 bg-white p-4 rounded shadow-sm">
<h3 class="mb-3 text-center" style="color: #003366;">Acessar o Sistema</h3>
<form method="POST">
<div class="mb-3"><label class="form-label">E-mail</label><input type="email" name="email" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Senha</label><input type="password" name="password" class="form-control" required></div>
<button type="submit" class="btn btn-warning w-100 fw-bold">Entrar</button>
</form></div></div>
{% endblock %}
