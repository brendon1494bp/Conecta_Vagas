<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Início - Conecta Vagas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #949494, #949494, #949494);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        h2 {
            color: #333333;
            margin-top: 0;
            margin-bottom: 25px;
        }

        a.btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background-color: #494c50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }

        a.btn:hover {
            background-color: #0056b3;
        }

        a.btn-cadastrar {
            background-color: #28a745;
        }

        a.btn-cadastrar:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Conecta Vagas</h2>
        <a href="login.html" class="btn">Login</a>
        <a href="cadastro.html" class="btn btn-cadastrar">Cadastrar</a>
    </div>

</body>

</html>
