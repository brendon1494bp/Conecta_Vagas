<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dados do Aluno</title>
    <style>
        /* 1. Fundo da página */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #949494, #949494, #949494);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* 2. Cartão central (aumentei um pouco a largura para caber bem os dados) */
        .cartao {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px; 
            box-sizing: border-box;
        }

        /* 3. Títulos */
        h2 {
            text-align: center;
            color: #333333;
            margin-top: 0;
            margin-bottom: 20px;
        }

        h3 {
            color: #555;
            font-size: 16px;
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        /* 4. Campos de digitação e seleção */
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            color: #333333;
        }

        /* 5. Botão Solicitar */
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="cartao">
        <h2>Dados do Aluno</h2>
        
        <!-- ================= DADOS ATUAIS ================= -->
        <input type="text" placeholder="Nome do aluno *" required>
        
        <input type="text" placeholder="Escola atual *" required>
        
        <select required>
            <option value="">Turno atual *</option>
            <option value="Matutino">Matutino</option>
            <option value="Vespertino">Vespertino</option>
            <option value="Noturno">Noturno</option>
        </select>
        
        <input type="text" placeholder="Série atual *" required>
        
        <select required>
            <option value="">Cidade/RA atual *</option>
            <option value="Plano Piloto">Plano Piloto</option>
            <option value="Taguatinga">Taguatinga</option>
            <option value="Ceilândia">Ceilândia</option>
        </select>

        <!-- ================= DESTINO ================= -->
        <h3>Para onde você quer ir:</h3>
        
        <select required id="nova-ra">
            <option value="">Nova Cidade/RA...</option>
            <option value="Plano Piloto">Plano Piloto</option>
            <option value="Taguatinga">Taguatinga</option>
            <option value="Ceilândia">Ceilândia</option>
        </select>
        
        <select required id="nova-escola">
            <option value="">Nova Escola...</option>
            <!-- Aqui você pode reaproveitar aquele JavaScript da API para preencher as escolas -->
        </select>

        <select required>
            <option value="">Novo Turno...</option>
            <option value="Matutino">Matutino</option>
            <option value="Vespertino">Vespertino</option>
            <option value="Noturno">Noturno</option>
        </select>

        <!-- ================= BOTÃO ================= -->
        <button type="submit">Solicitar</button>
    </div>

</body>
</html>
