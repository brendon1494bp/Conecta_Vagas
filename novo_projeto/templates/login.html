<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login - Conecta Vagas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #949494, #949494, #949494);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 300px;
        }

        h2 {
            text-align: center;
            color: #333333;
            margin-top: 0;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button, .btn-voltar {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #494c50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }

        button:hover {
            background-color: #0056b3;
        }

        .btn-voltar {
            background-color: #6c757d;
        }

        .btn-voltar:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Login</h2>

        <form action="/login" method="POST">
            
            E-mail ou Telefone:<br>
            <input name="login_usuario" type="text" required><br>

            Senha:<br>
            <input name="senha" type="password" required><br>

            <button type="submit">Entrar</button>
            <a href="/index.html" class="btn-voltar">Voltar</a>
        </form>
    </div>

</body>

</html>
