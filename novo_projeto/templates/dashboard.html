<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Conecta Vagas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #949494, #949494, #949494);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .dashboard-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #333333;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .metric-box {
            background: #f4f6f8;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }

        .metric-box h3 {
            margin: 0 0 5px 0;
            color: #555;
            font-size: 14px;
        }

        .metric-box p {
            margin: 0;
            color: #28a745;
            font-size: 22px;
            font-weight: bold;
        }

        button, .btn-acao {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #494c50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }

        button:hover, .btn-acao:hover {
            background-color: #0056b3;
        }

        .btn-sair {
            background-color: #dc3545;
        }

        .btn-sair:hover {
            background-color: #c82333;
        }
    </style>
</head>

<body>

    <div class="dashboard-card">
        <h2>Dashboard</h2>

        <div class="metric-box">
            <h3>Vagas Disponíveis</h3>
            <p>18</p>
        </div>

        <div class="metric-box">
            <h3>Minhas Solicitações</h3>
            <p>3</p>
        </div>

        <div class="metric-box">
            <h3>Matches Realizados</h3>
            <p>1</p>
        </div>

        <a href="acompanhamento.html" class="btn-acao">Acompanhar Solicitações</a>
        <a href="login.html" class="btn-sair">Sair (Logout)</a>
    </div>

</body>

</html>
