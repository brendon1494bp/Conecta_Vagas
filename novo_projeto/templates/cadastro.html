<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #949494, #949494, #949494);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 300px;
        }

        h2 {
            text-align: center;
            color: #333333;
            margin-top: 0;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button, .btn-voltar {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }

        button:hover {
            background-color: #218838;
        }

        .btn-voltar {
            background-color: #494c50;
        }

        .btn-voltar:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Criar Conta</h2>
    
        <form action="http://127.0.0.1:5000/api/cadastrar" method="POST">
            Nome completo:<br>
            <input name="Nome" type="text" placeholder="Seu nome completo" required><br>

            Telefone:<br>
            <input  name="telefone" type="tel" placeholder="(11) 99999-9999" required><br>
    
            E-mail:<br>_
            <input name="E-mail" type="email" placeholder="seuemail@exemplo.com" required><br>
    
            Senha:<br>
            <input name="Senha" type="password" placeholder="Mínimo de 8 caracteres" required><br>
    
            Confirmar Senha:<br>
            <input name="ConfirmaSenha" type="password" placeholder="Repita a senha" required><br>
    
            
    
            <button type="submit">Confirmar</button>
            <a href="login.html" class="btn-voltar">Voltar para o Login</a>
        </form>
    </div>
        </form>
    </div>

</body>

</html>
