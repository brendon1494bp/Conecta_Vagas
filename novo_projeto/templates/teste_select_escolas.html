<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Seleção de Escolas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #949494, #949494, #949494);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .cartao {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 300px;
        }

        h2 {
            text-align: center;
            color: #333333;
            margin-top: 0;
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            color: #333333;
        }
    </style>
</head>
<body>

    <div class="cartao">
        <h2>Busca por Cidade/RA</h2>
        
        <select id="select-ra">
            <option value="">Selecione uma Cidade/RA...</option>
            <option value="1">Plano Piloto</option>
            <option value="2">Taguatinga</option>
            <option value="3">Ceilândia</option>
        </select>

        <div id="area-escolas"></div>
    </div>

    <script>
        const select = document.getElementById('select-ra');
        const areaEscolas = document.getElementById('area-escolas');

        select.addEventListener('change', async (evento) => {
            const regiaoEscolhida = evento.target.value;
            
            if (regiaoEscolhida === "") {
                areaEscolas.innerHTML = ""; 
                return; 
            }

            try {
                areaEscolas.innerHTML = "<p style='text-align: center; color: #333333;'>Carregando escolas...</p>";

                const idRa = regiaoEscolhida;

                // --- A MUDANÇA FOI APENAS AQUI ---
                // Agora passamos o idRa diretamente na URL usando ?ra=
                // O método GET já é o padrão do fetch, então não precisamos declarar 'method', 'headers' ou 'body'.
                
                const resposta = await fetch(`http://127.0.0.1:5000/escolas/buscar-por-ra?ra=${idRa}`);

                const escolas = await resposta.json();

                let novoSelectHTML = `<select id="select-escola">`;
                novoSelectHTML += `<option value="">Selecione uma escola...</option>`;

                if (Array.isArray(escolas)) {
                    escolas.forEach(escola => {
                        novoSelectHTML += `<option value="${escola.id}">${escola.nome}</option>`;
                    });
                } else {
                    novoSelectHTML += `<option value="${escolas.id}">${escolas.nome}</option>`;
                }
                
                novoSelectHTML += `</select>`;
                areaEscolas.innerHTML = novoSelectHTML;

            } catch (erro) {
                areaEscolas.innerHTML = "<p style='color: red; text-align: center;'>Erro ao buscar.</p>";
                console.error(erro);
            }
        });
    </script>
</body>
</html>
